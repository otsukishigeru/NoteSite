<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="知働化コミュニティへのお問い合わせフォーム。知働化経営・AI活用・組織設計に関するご質問・ご依頼はこちらからお気軽にどうぞ。">
<title>お問い合わせ | 知働化コミュニティ</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg:          #0B1628;
  --white:       #132035;
  --mid:         #1E2A40;
  --text-main:   #DDE6F4;
  --text-sub:    #8AAAC8;
  --text-light:  #4E6A88;
  --border:      #1C3050;
  --accent:      #8EB4E3;
  --accent-dark: #5A8FC8;
  --shadow-sm:   0 2px 8px rgba(0,0,0,.28);
  --shadow-md:   0 4px 20px rgba(0,0,0,.40);
  --radius:      12px;
  --radius-lg:   20px;
  --header-h:    64px;
}

html { scroll-behavior: smooth; font-size: 16px; }
body {
  font-family: 'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic','Meiryo',sans-serif;
  background: var(--bg); color: var(--text-main); line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ── ヘッダー ── */
.site-header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(11,22,40,.92); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
  height: var(--header-h);
}
.header-inner {
  max-width: 900px; margin: 0 auto; padding: 0 24px;
  height: 100%; display: flex; align-items: center; justify-content: space-between;
}
.logo-block { display: flex; align-items: center; gap: 12px; }
.logo-icon {
  width: 36px; height: 36px; border-radius: 8px;
  background: linear-gradient(135deg, #1d2f5f 0%, #2a4a8f 100%);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 700; color: #fff;
}
.logo-main { font-size: 15px; font-weight: 700; color: var(--text-main); }
.logo-sub  { font-size: 11px; color: var(--text-sub); display: block; }
.nav-back {
  font-size: 13px; color: var(--text-sub);
  border: 1px solid var(--border); border-radius: 6px;
  padding: .35rem .9rem; transition: background .2s, color .2s;
}
.nav-back:hover { background: var(--mid); color: var(--text-main); text-decoration: none; }

/* ── メインコンテンツ ── */
.contact-wrap {
  max-width: 720px; margin: 0 auto; padding: 56px 24px 96px;
}

.page-head { margin-bottom: 40px; }
.page-eyebrow {
  font-size: 11px; letter-spacing: .14em; color: var(--accent);
  text-transform: uppercase; margin-bottom: 8px;
}
.page-title {
  font-size: clamp(1.6rem, 4vw, 2.4rem); font-weight: 700;
  color: var(--text-main); line-height: 1.3; margin-bottom: 14px;
}
.page-lead { font-size: .97rem; color: var(--text-sub); line-height: 1.8; }

/* ── フォームカード ── */
.form-card {
  background: var(--white); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 40px;
  box-shadow: var(--shadow-md);
}

.form-group { margin-bottom: 24px; }
.form-label {
  display: block; font-size: .88rem; font-weight: 600;
  color: var(--text-sub); margin-bottom: 8px; letter-spacing: .03em;
}
.form-label .required {
  display: inline-block; background: var(--accent-dark);
  color: #fff; font-size: .72rem; font-weight: 700;
  padding: .1rem .4rem; border-radius: 4px; margin-left: 6px;
  vertical-align: middle;
}
.form-input,
.form-textarea {
  width: 100%; padding: .75rem 1rem;
  background: var(--mid); border: 1.5px solid var(--border);
  border-radius: 8px; color: var(--text-main); font-size: .97rem;
  font-family: inherit; transition: border-color .2s, box-shadow .2s;
  box-sizing: border-box;
}
.form-input::placeholder,
.form-textarea::placeholder { color: var(--text-light); }
.form-input:focus,
.form-textarea:focus {
  outline: none; border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(142,180,227,.15);
}
.form-textarea { min-height: 160px; resize: vertical; line-height: 1.7; }

.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 560px) { .form-row { grid-template-columns: 1fr; } }

/* ── 送信ボタン ── */
.btn-submit {
  width: 100%; padding: 1rem; margin-top: 8px;
  background: linear-gradient(135deg, #1d2f5f 0%, #2a4a8f 100%);
  color: #fff; border: none; border-radius: 10px;
  font-size: 1rem; font-weight: 700; letter-spacing: .04em;
  cursor: pointer; transition: opacity .2s, transform .15s;
}
.btn-submit:hover:not(:disabled) { opacity: .88; transform: translateY(-1px); }
.btn-submit:disabled { opacity: .55; cursor: not-allowed; }

/* ── メッセージ ── */
.form-msg {
  margin-top: 20px; padding: 16px 20px; border-radius: 8px;
  font-size: .94rem; line-height: 1.6; display: none;
}
.form-msg.ok  { display: block; background: rgba(45,106,45,.2); border: 1px solid #2d6a2d; color: #7ecb7e; }
.form-msg.err { display: block; background: rgba(192,57,43,.15); border: 1px solid #c0392b; color: #f08080; }

/* ── サイド情報 ── */
.contact-note {
  margin-top: 32px; padding: 24px;
  background: var(--mid); border: 1px solid var(--border);
  border-radius: var(--radius); font-size: .9rem; color: var(--text-sub);
  line-height: 1.8;
}
.contact-note strong { color: var(--text-main); }

/* ── フッター ── */
.site-footer {
  text-align: center; padding: 32px 24px;
  border-top: 1px solid var(--border);
  font-size: .88rem; color: var(--text-sub);
}
.site-footer a { color: var(--accent); }
.site-footer p + p { margin-top: 8px; }
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="logo-block">
      <div class="logo-icon">知</div>
      <div class="logo-text">
        <span class="logo-main">知働化コミュニティ</span>
        <span class="logo-sub">chidouka-lab.com</span>
      </div>
    </div>
    <a href="/" class="nav-back">← トップへ</a>
  </div>
</header>

<main class="contact-wrap">

  <div class="page-head">
    <p class="page-eyebrow">Contact</p>
    <h1 class="page-title">お問い合わせ</h1>
    <p class="page-lead">
      知働化経営・AI活用・組織設計・ソフトウェア工学に関するご質問や、<br>
      講演・執筆・コンサルティングのご依頼はこちらからお気軽にどうぞ。<br>
      お送りいただいた内容は担当者（知働化コミュニティメンバ）が確認し、折り返しご連絡いたします。
    </p>
  </div>

  <div class="form-card">
    <form id="contact-form" novalidate>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="field-name">
            お名前<span class="required">必須</span>
          </label>
          <input id="field-name" class="form-input" type="text"
            name="name" placeholder="山田 太郎" required autocomplete="name">
        </div>
        <div class="form-group">
          <label class="form-label" for="field-email">
            メールアドレス<span class="required">必須</span>
          </label>
          <input id="field-email" class="form-input" type="email"
            name="email" placeholder="example@email.com" required autocomplete="email">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="field-org">
          会社名・所属
        </label>
        <input id="field-org" class="form-input" type="text"
          name="org" placeholder="（任意）" autocomplete="organization">
      </div>

      <div class="form-group">
        <label class="form-label" for="field-subject">
          件名<span class="required">必須</span>
        </label>
        <input id="field-subject" class="form-input" type="text"
          name="subject" placeholder="例：知働化コンサルティングについて" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="field-message">
          メッセージ<span class="required">必須</span>
        </label>
        <textarea id="field-message" class="form-textarea"
          name="message" placeholder="お問い合わせ内容をご記入ください。" required></textarea>
      </div>

      <button type="submit" class="btn-submit" id="submit-btn">送信する</button>
      <div id="form-msg" class="form-msg"></div>

    </form>
  </div>

  <div class="contact-note">
    <strong>ご返信について：</strong>通常2〜3営業日以内にご返信いたします。<br>
    お急ぎの場合は件名に「緊急」とご記入ください。<br>
  </div>

</main>

<footer class="site-footer">
  <p style="font-size:13px;font-weight:700;margin-bottom:8px;">知働化メンバ</p>
  <p>
    <a href="/ichi_s_otsuki/">1_s_o</a>　｜
    <a href="/carl/">t0rapa</a>　｜
    <a href="/Hg/">Hg</a>　｜
    <a href="/St/">St</a>
  </p>
  <p style="margin-top:14px;font-size:10px;opacity:.5;">© 知働化コミュニティ</p>
</footer>

<script>
(function () {
  const form      = document.getElementById('contact-form');
  const submitBtn = document.getElementById('submit-btn');
  const msgEl     = document.getElementById('form-msg');

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    msgEl.className = 'form-msg';
    msgEl.style.display = 'none';

    const name    = document.getElementById('field-name').value.trim();
    const email   = document.getElementById('field-email').value.trim();
    const org     = document.getElementById('field-org').value.trim();
    const subject = document.getElementById('field-subject').value.trim();
    const message = document.getElementById('field-message').value.trim();

    if (!name || !email || !subject || !message) {
      msgEl.className = 'form-msg err';
      msgEl.textContent = '必須項目（お名前・メールアドレス・件名・メッセージ）をご入力ください。';
      return;
    }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      msgEl.className = 'form-msg err';
      msgEl.textContent = 'メールアドレスの形式が正しくありません。';
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = '送信中...';

    try {
      const res = await fetch('/api/contact/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, org, subject, message })
      });
      const data = await res.json();
      if (res.ok && data.ok) {
        msgEl.className = 'form-msg ok';
        msgEl.textContent = 'お問い合わせを受け付けました。ありがとうございます。折り返しご連絡いたします。';
        form.reset();
      } else {
        throw new Error(data.error || '送信に失敗しました。');
      }
    } catch (err) {
      msgEl.className = 'form-msg err';
      msgEl.textContent = err.message || '送信中にエラーが発生しました。時間をおいて再度お試しください。';
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = '送信する';
    }
  });
})();
</script>
</body>
</html>
